services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: metodo
      POSTGRES_PASSWORD: metodo_local_only
      POSTGRES_DB: metodo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - metodo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metodo -d metodo"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  metodo_pg:
